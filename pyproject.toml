[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ripple"
version = "0.1.0"
description = "Deterministic repository analysis for change-surface prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
demo = [
    "streamlit>=1.50",
]

[project.scripts]
ripple = "ripple.cli:main"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Demo fixture app: input data imitating a third-party project, never executed.
extend-exclude = ["demo/fixtures/sample_app"]
